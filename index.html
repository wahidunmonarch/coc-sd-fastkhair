<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SD Fastabiqul Khairat Clash of Champions</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"SST","Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;font-weight:300;color:#fff;min-height:100vh;overflow-x:hidden;background:#02040c}
#app{perspective:1600px;perspective-origin:50% 35%;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:68px 18px 22px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
h1{font-weight:200;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(1.4rem,5vw,2.3rem);margin:.3em 0 .6em;line-height:1.15;text-align:center;text-shadow:2px 0 #ff2d7566,-2px 0 #00e5ff66,0 0 26px #5ee7ff55;animation:flick 6s infinite}
h2,h3{font-weight:400;letter-spacing:.08em;margin:.2em 0 .6em}
.sub{color:#9fd6ff;text-align:center;letter-spacing:.32em;font-weight:600;text-shadow:0 0 14px #4aa8ff88}.c{text-align:center}
small{font-weight:300}

/* ===== Bilah atas ala PS4 ===== */
#psbar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:8;font-size:.9rem;background:linear-gradient(#000b,#0000);pointer-events:none}
#psbar b{font-weight:600;letter-spacing:.2em;font-size:.78rem;opacity:.85}
#clk{font-variant-numeric:tabular-nums;font-weight:400;letter-spacing:.08em}

/* ===== Panel / kartu ===== */
.card{position:relative;overflow:hidden;background:linear-gradient(160deg,#0f2a5acc,#06122bdd);border:1px solid #ffffff2e;border-radius:6px;padding:20px 22px;margin:12px 0;box-shadow:0 18px 40px #000b,inset 0 1px 0 #ffffff26}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff09 0 1px,#0000 1px 3px)}
.card::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;background:linear-gradient(100deg,#0000,#5ee7ff22,#ff7ad922,#0000);transform:skewX(-18deg);animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}
@keyframes flick{0%,90%,100%{opacity:1;transform:none}91%{opacity:.65;transform:translateX(3px)}93%{opacity:1;transform:translateX(-3px)}95%{opacity:.85;transform:none}}
.holo{animation:flick 6s infinite;filter:drop-shadow(0 0 14px #5ee7ff88) drop-shadow(2px 0 0 #ff2d7544) drop-shadow(-2px 0 0 #00e5ff44)}
.g3d{transform:perspective(1100px) rotateX(3deg);transform-origin:50% 100%}

/* ===== Tombol / fokus ala PS4 ===== */
button{font:inherit;font-weight:500;cursor:pointer;color:#fff;border:2px solid transparent;border-radius:4px;background:#ffffff17;padding:14px 20px;min-height:54px;letter-spacing:.04em;position:relative;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,background .18s,border-color .18s}
button:hover,button:focus-visible{outline:0;transform:scale(1.045);background:#ffffff2b;border-color:#fff;box-shadow:0 0 0 2px #ffffff55,0 0 28px #4aa8ffaa,0 14px 30px #000a;animation:fpulse 1.4s ease-in-out infinite}
@keyframes fpulse{50%{box-shadow:0 0 0 4px #ffffff33,0 0 40px #4aa8ffdd,0 14px 30px #000a}}
button:active{transform:scale(.985)}
button:disabled{opacity:.4;pointer-events:none}
.big{width:100%;font-size:1.1rem;margin:8px 0;text-transform:uppercase;letter-spacing:.12em}
.go{background:linear-gradient(135deg,#0a84ff,#0050b8);border-color:#6fc1ff66}
.alt{background:linear-gradient(135deg,#00b4a6,#0a63c9);border-color:#7ff0e666}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:90px}
.seg .on{background:#fff;color:#04112b;border-color:#fff;font-weight:700;box-shadow:0 0 22px #ffffff66}
.seg .on:hover{background:#fff}
.back{background:none;border:0;min-height:40px;padding:6px 0;box-shadow:none;align-self:flex-start;opacity:.85;animation:none}
.back:hover,.back:focus-visible{background:none;border:0;box-shadow:none;transform:translateX(-5px);opacity:1;animation:none}
label{display:block;margin:14px 0 6px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:500}
input{width:100%;padding:13px 14px;border-radius:4px;border:2px solid #ffffff33;background:#00000066;color:#fff;font:inherit;font-weight:400}
input:focus{outline:0;border-color:#fff;box-shadow:0 0 18px #4aa8ff88}
input[type=range]{padding:0;accent-color:#4aa8ff}
.row{display:flex;gap:10px}.row>div{flex:1}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:14px}

/* ===== Tile menu ===== */
.mc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px 22px;min-height:190px;text-align:center;background:linear-gradient(160deg,#ffffff22,#ffffff0b);border:2px solid #ffffff22}
.mc .ic{font-size:3rem;line-height:1;filter:drop-shadow(0 4px 10px #000a);transition:transform .25s;margin-bottom:8px}
.mc:hover .ic,.mc:focus-visible .ic{transform:scale(1.18) rotate(-5deg)}
.mc b{font-size:1.25rem;font-weight:600;letter-spacing:.06em;display:block}
.mc small{opacity:.78}
.mc.go{background:linear-gradient(145deg,#1a8fff,#0044a8)}
.mc.alt{background:linear-gradient(145deg,#00b4a6,#0a63c9)}
.mc.rm{min-height:0;padding:14px 18px;gap:2px;align-items:flex-start;justify-content:flex-start;text-align:left}
.mc>*,.opt>*{pointer-events:none}

.hud{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600}
.wrap>.hud>span{background:#0b1e45cc;border:1px solid #ffffff2a;border-radius:4px;padding:8px 14px}
.bar{height:8px;background:#ffffff1f;overflow:hidden;margin:8px 0;box-shadow:inset 0 2px 4px #000a}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#0a84ff,#5ee7ff);box-shadow:0 0 14px #5ee7ffaa;width:100%;transition:width .1s linear}
.q{font-size:clamp(1.2rem,3.8vw,1.7rem);font-weight:400;margin:10px 0 18px;min-height:3em;text-shadow:0 0 18px #5ee7ff55}

/* ===== Pilihan jawaban: simbol PS ===== */
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:9px 0;background:#ffffff14;font-size:1.08rem;font-weight:400;border-left:6px solid var(--sc,#fff)}
.opt .sy{font-size:1.5rem;width:1.6em;text-align:center;color:var(--sc);text-shadow:0 0 12px var(--sc)}
.opt span{flex:1}.opt{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.opt em{opacity:.55;font-style:normal;font-size:.78rem;border:1px solid #ffffff66;border-radius:3px;padding:1px 7px}
.opt.s0{--sc:#2fe0a8}.opt.s1{--sc:#ff5d73}.opt.s2{--sc:#4aa8ff}.opt.s3{--sc:#ff7ad9}
.opt.ok{background:#1faa5fdd;border-color:#fff}.opt.no{background:#d63a55dd}

.lb>div{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:4px;background:#ffffff12;margin:5px 0;border-left:4px solid #ffffff33}
.lb .me{border-left-color:#4aa8ff;background:#4aa8ff26;box-shadow:0 0 18px #4aa8ff44}
.fl{position:fixed;left:45%;top:30%;font-size:4rem;font-weight:900;animation:up 1s forwards;pointer-events:none;z-index:9;text-shadow:0 2px 0 #000,0 5px 0 #0007,0 10px 16px #000a}
@keyframes up{to{transform:translateY(-120px);opacity:0}}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:200px}
.pod>div{flex:1;max-width:130px;text-align:center;border-radius:4px 4px 0 0;background:linear-gradient(#4aa8ff,#0b3a8a);animation:rise .9s backwards;padding-top:8px;overflow:hidden;box-shadow:inset 0 3px 0 #ffffff55,0 10px 20px #000a}
.pod .p1{background:linear-gradient(#ffe27a,#ffb300);color:#2b1700}
@keyframes rise{from{height:0}}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;text-align:center;border-bottom:1px solid #ffffff1f}th{font-weight:600;opacity:.8;font-size:.82rem;letter-spacing:.08em}
.code{font-size:2.6rem;letter-spacing:.3em;font-weight:700;text-align:center;color:#c8f6ff;text-shadow:2px 0 #ff2d75aa,-2px 0 #00e5ffaa,0 0 24px #5ee7ff;animation:flick 5s infinite}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000e;border:1px solid #ffffff44;padding:10px 18px;border-radius:4px;display:none;z-index:40}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3ddc84;margin-right:6px;box-shadow:0 0 8px currentColor}.dot.off{background:#ff5d73}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal .card{width:100%;max-width:420px}

/* ===== Latar bergerak biru-hitam-maroon (dipertahankan) ===== */
body::before,body::after{content:'';position:fixed;inset:-25%;z-index:-2;pointer-events:none;will-change:transform,opacity}
body::before{background:radial-gradient(circle at 25% 20%,#2f55b8,transparent 55%),radial-gradient(circle at 80% 80%,#0a1a45,transparent 60%),linear-gradient(135deg,#0d2a6e,#050a18 60%,#000);animation:bl 48s ease-in-out infinite,dr 32s ease-in-out infinite alternate}
body::after{background:radial-gradient(circle at 75% 25%,#8a1a3c,transparent 55%),radial-gradient(circle at 20% 85%,#4a0a22,transparent 60%),linear-gradient(315deg,#4d0b24,#08040a 60%,#000);opacity:0;animation:mr 48s ease-in-out infinite,dr 38s ease-in-out infinite alternate-reverse}
@keyframes bl{0%,12%,88%,100%{opacity:1}32%,68%{opacity:0}}
@keyframes mr{0%,32%,68%,100%{opacity:0}50%{opacity:1}}
@keyframes dr{from{transform:translate3d(-4%,-3%,0) rotate(0)}to{transform:translate3d(4%,3%,0) rotate(6deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
/* lapisan hologram: garis pindai + vinyet */
#holo{position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,#5ee7ff0b 0 1px,#0000 1px 4px),radial-gradient(ellipse at 50% 50%,#0000 55%,#000a 100%);animation:scan 9s linear infinite}
@keyframes scan{to{background-position:0 80px,0 0}}

/* ===== Transisi 3D antar layar ===== */
.t-out{animation-duration:.32s;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.55,0,.9,.45);pointer-events:none}
.t-in{animation-duration:.6s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.15,.85,.25,1)}
@keyframes cOF{to{transform:translate3d(-55%,0,-650px) rotateY(-72deg);opacity:0}}
@keyframes cIF{from{transform:translate3d(55%,0,-650px) rotateY(72deg);opacity:0}}
@keyframes cOB{to{transform:translate3d(55%,0,-650px) rotateY(72deg);opacity:0}}
@keyframes cIB{from{transform:translate3d(-55%,0,-650px) rotateY(-72deg);opacity:0}}
@keyframes fOF{to{transform-origin:50% 100%;transform:translate3d(0,-25%,-350px) rotateX(78deg);opacity:0}}
@keyframes fIF{from{transform-origin:50% 0;transform:translate3d(0,25%,-350px) rotateX(-78deg);opacity:0}}
@keyframes fOB{to{transform-origin:50% 0;transform:translate3d(0,25%,-350px) rotateX(-78deg);opacity:0}}
@keyframes fIB{from{transform-origin:50% 100%;transform:translate3d(0,-25%,-350px) rotateX(78deg);opacity:0}}
@keyframes wO{to{transform:translateZ(1100px) scale(1.25);opacity:0;filter:blur(10px)}}
@keyframes wI{from{transform:translateZ(-1400px) scale(.4);opacity:0;filter:blur(12px)}}
.t-out.x-Cf{animation-name:cOF}.t-in.x-Cf{animation-name:cIF}
.t-out.x-Cb{animation-name:cOB}.t-in.x-Cb{animation-name:cIB}
.t-out.x-Ff{animation-name:fOF}.t-in.x-Ff{animation-name:fIF}
.t-out.x-Fb{animation-name:fOB}.t-in.x-Fb{animation-name:fIB}
.t-out.x-Wf,.t-out.x-Wb{animation-name:wO;animation-duration:.45s}.t-in.x-Wf,.t-in.x-Wb{animation-name:wI;animation-duration:.7s}
#tun{position:fixed;inset:0;z-index:30;pointer-events:none;display:none;overflow:hidden}
#tun.on{display:block}
#tun::before{content:'';position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,#5ee7ff66 0 1.2deg,#0000 1.2deg 9deg);-webkit-mask-image:radial-gradient(circle,#0000 6%,#000 70%);mask-image:radial-gradient(circle,#0000 6%,#000 70%);animation:tunr .8s ease-in forwards}
#tun::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,#fff,#8ef0ff 25%,#0000 62%);opacity:0;animation:flash .8s ease-in forwards}
@keyframes tunr{from{transform:scale(.3) rotate(0);opacity:0}30%{opacity:1}to{transform:scale(2.4) rotate(45deg);opacity:0}}
@keyframes flash{0%,55%{opacity:0}75%{opacity:.85}100%{opacity:0}}

@media(max-width:560px){.wrap{padding:60px 12px 16px}.mc{min-height:120px;padding:16px}.mc .ic{font-size:2.2rem}.code{font-size:2rem}}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}body::after{opacity:0}#fx,#holo,#tun{display:none}.card::after{display:none}h1,.holo,.code,button:hover,button:focus-visible{animation:none}}
</style></head><body><canvas id="fx"></canvas><div id="holo"></div><div id="psbar"><b>CLASH OF CHAMPIONS</b><span id="clk"></span></div><div id="app"></div><div id="modal"></div><div id="tun"></div><div id="toast"></div>

/* ---------- AUDIO ---------- */
const ST=Object.assign({mv:.5,music:true,sfx:true},JSON.parse(localStorage.getItem('fk_set')||'{}'));const saveST=()=>localStorage.setItem('fk_set',JSON.stringify(ST));

addEventListener('click',music,{once:true});

/* ---------- BANK SOAL ---------- */
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ri=(R,a,b)=>a+Math.floor(R()*(b-a+1)),pick=(R,a)=>a[Math.floor(R()*a.length)],sh=(A,R)=>{A=[...A];for(let i=A.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[A[i],A[j]]=[A[j],A[i]]}return A};

R=>{const b=ri(R,3,9),c=ri(R,12,60);return[`Berapa hasil ${b*c} ÷ ${b}?`,c,1,fm,`${b*c} ÷ ${b} = ${c}, karena ${c} × ${b} = ${b*c}.`,'Pembagian']},
R=>{const p=ri(R,8,30),l=ri(R,4,p-1);return[`Persegi panjang berukuran panjang ${p} cm dan lebar ${l} cm. Berapa kelilingnya (cm)?`,2*(p+l),2,fm,`Keliling = 2 × (${p} + ${l}) = ${2*(p+l)} cm.`,'Keliling bangun datar']},
R=>{const p=ri(R,6,25),l=ri(R,3,p-1);return[`Persegi panjang berukuran panjang ${p} cm dan lebar ${l} cm. Berapa luasnya (cm²)?`,p*l,p,fm,`Luas = ${p} × ${l} = ${p*l} cm².`,'Luas bangun datar']},
R=>{let x=pick(R,[3,4,5,6,8,9,10,12]),y=pick(R,[3,4,5,6,8,9,10,12]);if(x==y)y=x+2;const l=lcm(x,y);return[`KPK dari ${x} dan ${y} adalah ...`,l,x,fm,`Kelipatan persekutuan terkecil dari ${x} dan ${y} adalah ${l}.`,'KPK']},

5:[
R=>{const a=ri(R,8,40),t=ri(R,5,25);return[`Jajargenjang beralas ${a} cm dan tinggi ${t} cm. Berapa luasnya (cm²)?`,a*t,10,fm,`Luas = alas × tinggi = ${a} × ${t} = ${a*t} cm².`,'Luas bangun datar']},
R=>{const n=pick(R,[40,60,80,120,200,240,400]),p=pick(R,[10,20,25,50]);return[`${p}% dari ${n} adalah ...`,n*p/100,2,fm,`${p}/100 × ${n} = ${n*p/100}.`,'Persen']},
R=>{const p=ri(R,3,12),l=ri(R,3,12),t=ri(R,3,12);return[`Balok berukuran ${p} cm × ${l} cm × ${t} cm. Berapa volumenya (cm³)?`,p*l*t,p,fm,`Volume = p × l × t = ${p*l*t} cm³.`,'Volume bangun ruang']},
R=>{const [x,y]=pick(R,[[12,18],[24,36],[16,24],[30,45],[20,50],[18,27]]);return[`FPB dari ${x} dan ${y} adalah ...`,gcd(x,y),1,fm,`Faktor persekutuan terbesar ${x} dan ${y} adalah ${gcd(x,y)}.`,'FPB']},

async function rpc(n,a){const{data,error}=await sb.rpc(n,a);if(error)throw error;return data}
async function refresh(quiet){if(!RM)return;try{const a=await sb.from('rooms').select('*').eq('code',RM).single(),b=await sb.from('players').select('*').eq('room',RM);if(a.error||b.error)throw 0;ROOM=a.data;P=b.data;conn=true}catch(e){conn=false}updConn();if(!quiet&&conn)onUp()}
function updConn(){const d=$('#cd');if(d){d.className='dot'+(conn?'':' off');d.nextSibling.textContent=conn?'Terhubung':'Terputus – mencoba lagi…'}}
function unsub(){clearInterval(pollT);if(ch&&sb)sb.removeChannel(ch);ch=null}
function subRT(){unsub();const f=t=>({event:'*',schema:'public',table:t,filter:(t=='rooms'?'code':'room')+'=eq.'+RM});ch=sb.channel('r'+RM).on('postgres_changes',f('players'),()=>refresh()).on('postgres_changes',f('rooms'),()=>refresh()).subscribe();pollT=setInterval(refresh,2500)}
function joined(d,mod){ME=d.pid;MOD=!!mod;RM=d.code;BT=MOD&&cfg.kind==='battle';localStorage.setItem('fk_sess',JSON.stringify({pid:ME,code:RM,mod:MOD,bt:BT}));subRT();refresh(true).then(()=>{if(ROOM&&ROOM.status==='playing'){scr='lobby';MOD?go('mon'):startGame()}else go('lobby')})}
async function mkRoom(){if(!sb)return toast('Koneksi online belum tersedia. Periksa internet lalu muat ulang halaman.');if(!cfg.name.trim())return toast('Isi nama dulu');try{joined(await rpc('create_room',{p_name:cfg.name.trim(),p_grade:cfg.grade,p_subject:cfg.subj,p_target:Math.min(500,Math.max(10,cfg.target||100)),p_secs:Math.min(120,Math.max(5,cfg.secs||20)),p_mode:cfg.mode,p_maxp:cfg.kind==='battle'?2:cfg.mode==='team'?4:cfg.maxp}),true)}catch(e){toast(e.message)}}
async function joinRoom(){if(!sb)return toast('Koneksi online belum tersedia. Periksa internet lalu muat ulang halaman.');if(!cfg.name.trim()||cfg.code.length<5)return toast('Isi nama dan kode room (5 huruf)');try{joined(await rpc('join_room',{p_code:cfg.code,p_name:cfg.name.trim(),p_team:cfg.jt}))}catch(e){toast(e.message)}}
async function resume(){const s=JSON.parse(localStorage.getItem('fk_sess')||'null');if(!s||!sb)return;ME=s.pid;MOD=!!s.mod;BT=!!s.bt;RM=s.code;subRT();await refresh(true);if(!ROOM||(!MOD&&!P.find(p=>p.id===ME))){toast('Room sudah tidak ada');return leave(true)}ROOM.status==='waiting'?go('lobby'):ROOM.status==='playing'?(scr='lobby',MOD?go('mon'):startGame()):(scr='lobby',end())}

function rep(){const a=grp(),t=!G.solo&&ROOM&&ROOM.mode==='team',c=G.solo?G.cfg:{grade:ROOM.grade,subj:ROOM.subject,target:ROOM.target},ms=Object.entries(G.miss).sort((x,y)=>y[1]-x[1]);
 return`<h1>SD Fastabiqul Khairat - Clash of Champions</h1><h2>Laporan Hasil Pertandingan</h2><p>Tanggal: ${new Date().toLocaleString('id-ID')}<br>Mode: ${G.solo?'Main Solo':(BT?'Battle 1 vs 1':'Online')+' ('+(t?'Beregu':'Individu')+')'}${G.solo?'':'<br>Kode room: '+esc(RM)}<br>Kelas ${c.grade} | ${GL[c.subj]} | Target ${c.target} poin | Benar +5, salah -5, lewat 0</p><p><b>Pemenang: ${esc(a[0].name)} (${a[0].score} poin)</b></p><table border="1" cellspacing="0" cellpadding="6"><tr><th>No</th><th>Nama</th><th>Nilai</th><th>Benar</th><th>Salah</th><th>Akurasi</th><th>Soal dijawab</th></tr>${a.map((g,k)=>`<tr><td>${k+1}</td><td>${esc(g.name)}</td><td>${g.score}</td><td>${g.correct}</td><td>${g.wrong}</td><td>${acc(g)}</td><td>${g.answered}/100</td></tr>`).join('')}</table>${t?'<h3>Kontribusi anggota</h3>'+a.map(g=>`<p><b>${esc(g.name)}</b>: ${g.mem.map(p=>esc(p.name)+' ('+p.score+' poin)').join(', ')}</p>`).join(''):''}<h3>Ringkasan belajar</h3><p>${ms.length?'Topik yang perlu diulang: '+ms.map(([k,n])=>esc(k)+' ('+n+'x salah)').join(', ')+'.':'Tidak ada jawaban salah yang tercatat di perangkat ini.'}</p>`}
function dl(k){const h=rep(),n='hasil-clash-of-champions';
 if(k==='doc'){const b=new Blob(['\ufeff<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Hasil</title></head><body style="font-family:Arial">'+h+'</body></html>'],{type:'application/msword'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n+'.doc';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('File Word diunduh')}
 else{const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.appendChild(f);const d=f.contentDocument;d.open();d.write('<html><head><meta charset="utf-8"><title>'+n+'</title><style>body{font-family:Arial,sans-serif;padding:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #444;padding:6px;text-align:center}</style></head><body>'+h+'</body></html>');d.close();toast("Di dialog cetak, pilih 'Simpan sebagai PDF'");setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print()},400);setTimeout(()=>f.remove(),60000)}}
function draw(){if(TR)return;$('#app').innerHTML=SC[scr]();if(scr==='game')showQ();updConn();music();rlSync()}
function quit(){if(confirm('Keluar dari permainan?')){window.close();toast('Sampai jumpa, juara! Kamu bisa menutup tab ini.')}}
addEventListener('keydown',e=>{if(scr!=='game'||!G||!G.run||e.target.tagName==='INPUT')return;const k='1234'.indexOf(e.key),l='abcd'.indexOf(e.key.toLowerCase());if(e.key.length==1){if(k>=0)ans(k);else if(l>=0)ans(l);else if(e.key.toLowerCase()==='s')ans(-2)}});
/* ---------- PS4: jam, bunyi fokus, navigasi arah ---------- */
(function(){const k=()=>{const e=$('#clk');if(e)e.textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':')};k();setInterval(k,15000)})();
let lastB=null;document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&b!==lastB&&!b.disabled){lastB=b;if(ST.sfx)tone(1100,.04,'sine',.05)}});
addEventListener('keydown',e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(!d)return;const a=document.activeElement;if(a&&a.tagName==='INPUT')return;
 const bs=[...document.querySelectorAll($('#modal button')?'#modal button':'#app button')].filter(b=>!b.disabled&&b.offsetParent!==null);if(!bs.length)return;e.preventDefault();
 const cur=bs.includes(a)?a:null;if(!cur){bs[0].focus();return}
 const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bd=1e9;
 for(const b of bs){if(b===cur)continue;const q=b.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy,al=dx*d[0]+dy*d[1];if(al<=4)continue;const sc=al+(Math.abs(dx*d[1])+Math.abs(dy*d[0]))*2.2;if(sc<bd){bd=sc;best=b}}
 if(best){best.focus();best.scrollIntoView({block:'nearest'})}});
/* klik kursor/sentuh pada pilihan jawaban (cadangan; ans() sudah menolak klik ganda lewat G.lock) */
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.opt[data-i]');if(b&&scr==='game'&&G&&!G.lock)ans(+b.dataset.i)});
draw();
</script>
<script>
// Atom, molekul & hologram di latar (tertata rapi di kolom kiri-kanan, di luar area konten)
(function(){const c=document.getElementById('fx');if(!c)return;const x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches,R=(a,b)=>a+Math.random()*(b-a);
let W,H,S=[],last=0,T=0,gl=0;const CY='120,230,255',MG='255,70,150',TY=['atom','mol','globe'];
function rs(){const d=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
// Tata letak: area konten maksimal 900px di tengah. Objek ditaruh di slot tetap pada margin kiri & kanan,
// berjarak rata dari atas ke bawah, ukurannya seragam, dan hanya melayang sedikit di tempatnya.
function mk(){S=[];const M0=(W-900)/2,comp=M0<134;let sl=[];
 if(!comp){const N=Math.max(2,Math.min(4,Math.round(H/260))),m=M0-26,top=64,bot=H-14,Rf=Math.min(m*.42,84,(bot-top)/N/2.6);
  for(let i=0;i<N;i++){const y=top+(bot-top)*(i+.5)/N-Rf*.1;sl.push({x:M0/2,y,t:i%3,Rf,a:1},{x:W-M0/2,y,t:(i+1)%3,Rf,a:1})}}
 else if(H>420)sl=[{x:W*.1,y:H*.9,t:0,Rf:30,a:.5},{x:W*.9,y:H*.17,t:1,Rf:30,a:.5}];
 sl.forEach((o,i)=>{const s={k:TY[o.t],bx:o.x,by:o.y,x:o.x,y:o.y,ph:i*1.7,sp:(i%2?-1:1)*(.7+.12*(i%3)),a:o.a};
  if(s.k==='atom')s.sc=o.Rf/50;else if(s.k==='mol'){s.sc=o.Rf/60;s.N=Array.from({length:6},()=>({x:R(-1,1),y:R(-1,1),z:R(-1,1)}))}else s.r=o.Rf*.95;
  S.push(s)})}
// dasar proyektor + berkas cahaya di bawah tiap objek hologram
function base(px,py,rx,a){x.strokeStyle=`rgba(${CY},${.38*a})`;x.lineWidth=1.2;x.beginPath();x.ellipse(px,py,rx,rx*.2,0,0,7);x.stroke();x.strokeStyle=`rgba(${CY},${.2*a})`;x.beginPath();x.ellipse(px,py,rx*.62+Math.sin(T*2)*3,rx*.12,0,0,7);x.stroke();
 const g=x.createLinearGradient(0,py,0,py-rx*1.5);g.addColorStop(0,`rgba(${CY},${.1*a})`);g.addColorStop(1,`rgba(${CY},0)`);x.fillStyle=g;x.beginPath();x.moveTo(px-rx,py);x.lineTo(px+rx,py);x.lineTo(px+rx*.35,py-rx*1.5);x.lineTo(px-rx*.35,py-rx*1.5);x.fill()}
function atom(s,col,a,dx){x.save();x.translate(dx,0);const r=5*s.sc,g=x.createRadialGradient(s.x,s.y,0,s.x,s.y,r*3);g.addColorStop(0,`rgba(${col},${.85*a})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.beginPath();x.arc(s.x,s.y,r*3,0,7);x.fill();
 for(let k=0;k<3;k++){const an=k*Math.PI/3+T*.1*s.sp,rx=48*s.sc,ry=17*s.sc;x.strokeStyle=`rgba(${col},${.32*a})`;x.lineWidth=1;x.beginPath();x.ellipse(s.x,s.y,rx,ry,an,0,7);x.stroke();
 const th=T*s.sp*1.6+k*2.1,px=rx*Math.cos(th),py=ry*Math.sin(th);x.fillStyle=`rgba(${col},${.95*a})`;x.beginPath();x.arc(s.x+px*Math.cos(an)-py*Math.sin(an),s.y+px*Math.sin(an)+py*Math.cos(an),2.6*s.sc+.6,0,7);x.fill()}x.restore()}
function mol(s,col,a,dx){x.save();x.translate(dx,0);const t1=T*.3*s.sp,t2=T*.17*s.sp,ca=Math.cos(t1),sa=Math.sin(t1),cb=Math.cos(t2),sb=Math.sin(t2),P=s.N.map(n=>{const x1=n.x*ca-n.z*sa,z1=n.x*sa+n.z*ca,y1=n.y*cb-z1*sb,z2=n.y*sb+z1*cb,f=1/(1+z2*.3);return{X:s.x+x1*44*s.sc*f,Y:s.y+y1*44*s.sc*f,f}});
 x.strokeStyle=`rgba(${col},${.3*a})`;x.lineWidth=1.5;x.beginPath();P.forEach((p,i)=>{const q=P[(i+1)%P.length];x.moveTo(p.X,p.Y);x.lineTo(q.X,q.Y);if(i%3==0){x.moveTo(p.X,p.Y);x.lineTo(P[0].X,P[0].Y)}});x.stroke();
 P.forEach((p,i)=>{x.fillStyle=i%2?`rgba(${MG},${.7*a})`:`rgba(${col},${.8*a})`;x.beginPath();x.arc(p.X,p.Y,(3+i%3*1.5)*s.sc*p.f+.5,0,7);x.fill()});x.restore()}
// bola dunia wireframe hologram
function globe(g,col,a,dx){x.save();x.translate(dx,0);const rot=T*g.sp*.5;x.lineWidth=1;x.strokeStyle=`rgba(${col},${.22*a})`;
 x.beginPath();x.arc(g.x,g.y,g.r,0,7);x.stroke();
 for(let i=0;i<6;i++){const rx=Math.abs(Math.cos(rot+i*Math.PI/6))*g.r;x.beginPath();x.ellipse(g.x,g.y,Math.max(1,rx),g.r,0,0,7);x.stroke()}
 for(const l of[-60,-30,0,30,60]){const r=l*Math.PI/180;x.beginPath();x.ellipse(g.x,g.y+g.r*Math.sin(r),g.r*Math.cos(r),g.r*Math.cos(r)*.26,0,0,7);x.stroke()}x.restore()}
function floor(){const y0=H*.7;x.lineWidth=1;for(let i=-12;i<=12;i++){x.strokeStyle=`rgba(${CY},${.07})`;x.beginPath();x.moveTo(W/2+i*W*.03,y0);x.lineTo(W/2+i*W*.16,H);x.stroke()}
 for(let j=0;j<9;j++){const t=((j+(T*.35)%1)/9),y=y0+(H-y0)*t*t;x.strokeStyle=`rgba(${CY},${.02+.09*t})`;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}}
function fr(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;T+=dt;if(!rm&&Math.random()<.004)gl=.2;if(gl>0)gl-=dt;
 x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';floor();
 const gx=gl>0?R(3,9):1.6,fa=gl>0?R(.35,1):1;
 for(const s of S){if(!rm){s.x=s.bx+Math.cos(T*.35+s.ph)*5;s.y=s.by+Math.sin(T*.55+s.ph)*7}
  const f=(.82+.18*Math.sin(T*23+s.ph))*fa*s.a;
  if(s.k==='globe'){base(s.x,s.y+s.r*1.05,s.r*.9,f);globe(s,CY,f,0);globe(s,MG,f*.4,gx)}
  else{base(s.x,s.y+54*s.sc,40*s.sc,f);const d=s.k==='atom'?atom:mol;d(s,CY,f,0);d(s,MG,f*.45,gx)}}
 // berkas pindai hologram
 const sy=((T*.16)%1.3-.15)*H,g=x.createLinearGradient(0,sy-70,0,sy+70);g.addColorStop(0,`rgba(${CY},0)`);g.addColorStop(.5,`rgba(${CY},.07)`);g.addColorStop(1,`rgba(${CY},0)`);x.fillStyle=g;x.fillRect(0,sy-70,W,140);
 x.globalCompositeOperation='source-over';if(!rm)requestAnimationFrame(fr)}
rs();mk();addEventListener('resize',()=>{rs();mk()});requestAnimationFrame(fr)})();
</script>
