let scr='home',cfg={name:'',grade:4,subj:'mat',target:100,secs:20,mode:'ind',maxp:2,code:'',jt:0,kind:'solo',role:'join'},G=null,RM=null,ROOM=null,P=[],ME=null,MOD=false,tm=null,pollT=null,ch=null,conn=true;
const GL={umum:'Umum',mat:'Matematika',ipas:'IPAS'};let BT=false;
const dd=a=>[...new Map(a.map(x=>[x[0],x])).values()];
function initG(solo,c,seed){const R=rng(seed+3),ip=[],gk=[];for(let g=4;g<=c.grade;g++){ip.push(...IP[g]);gk.push(...GK[g])}
 return{solo,cfg:c,seed,i:0,Q:[],USED:new Set(),miss:{},run:true,lock:false,ip:sh(dd(ip),R),gk:sh(dd(gk),R),me:{id:'me',name:cfg.name||'Pemain',team:0,score:0,correct:0,wrong:0,answered:0}}}
function build(i,t){const R=rng(G.seed+i*7919+t*104729+1),s=G.cfg.subj;let pool=null,k=0;
 if(s==='ipas'){pool=G.ip;k=i}else if(s==='umum'){pool=G.gk;k=i}
 let q,a,w,e,c;
 if(pool){const it=pool[k%pool.length];[q,a]=it;w=it.slice(2,5);e=it[5];c=it[6]}
 else{const [qq,av,st,f,ee,cc]=pick(R,MG[G.cfg.grade])(R);q=qq;a=f(av);w=nd(R,av,st).map(f);e=ee;c=cc}
 const o=sh([a,...w],R);return{q,opts:o,ans:o.indexOf(a),e,c}}
function getQ(i){if(G.Q[i])return G.Q[i];let q;for(let t=0;t<80;t++){q=build(i,t);if(!G.USED.has(q.q))break}G.USED.add(q.q);return G.Q[i]=q}

/* ---------- ONLINE ---------- */
async function rpc(n,a){const{data,error}=await sb.rpc(n,a);if(error)throw error;return data}
async function refresh(quiet){if(!RM)return;try{const a=await sb.from('rooms').select('*').eq('code',RM).single(),b=await sb.from('players').select('*').eq('room',RM);if(a.error||b.error)throw 0;ROOM=a.data;P=b.data;conn=true}catch(e){conn=false}updConn();if(!quiet&&conn)onUp()}
function updConn(){const d=$('#cd');if(d){d.className='dot'+(conn?'':' off');d.nextSibling.textContent=conn?'Terhubung':'Terputus – mencoba lagi…'}}
function unsub(){clearInterval(pollT);if(ch&&sb)sb.removeChannel(ch);ch=null}
function subRT(){unsub();const f=t=>({event:'*',schema:'public',table:t,filter:(t=='rooms'?'code':'room')+'=eq.'+RM});ch=sb.channel('r'+RM).on('postgres_changes',f('players'),()=>refresh()).on('postgres_changes',f('rooms'),()=>refresh()).subscribe();pollT=setInterval(refresh,2500)}
function joined(d,mod){ME=d.pid;MOD=!!mod;RM=d.code;BT=MOD&&cfg.kind==='battle';localStorage.setItem('fk_sess',JSON.stringify({pid:ME,code:RM,mod:MOD,bt:BT}));subRT();refresh(true).then(()=>{if(ROOM&&ROOM.status==='playing'){scr='lobby';MOD?go('mon'):startGame()}else go('lobby')})}
async function mkRoom(){if(!sb)return toast('Koneksi online belum tersedia. Periksa internet lalu muat ulang halaman.');if(!cfg.name.trim())return toast('Isi nama dulu');try{joined(await rpc('create_room',{p_name:cfg.name.trim(),p_grade:cfg.grade,p_subject:cfg.subj,p_target:cfg.target||100,p_secs:cfg.secs||20,p_mode:cfg.mode,p_maxp:cfg.kind==='battle'?2:cfg.mode==='team'?4:cfg.maxp}),true)}catch(e){toast(e.message)}}
async function joinRoom(){if(!sb)return toast('Koneksi online belum tersedia. Periksa internet lalu muat ulang halaman.');if(!cfg.name.trim()||cfg.code.length<5)return toast('Isi nama dan kode room (5 huruf)');try{joined(await rpc('join_room',{p_code:cfg.code,p_name:cfg.name.trim(),p_team:cfg.jt}))}catch(e){toast(e.message)}}
async function resume(){const s=JSON.parse(localStorage.getItem('fk_sess')||'null');if(!s||!sb)return;ME=s.pid;MOD=!!s.mod;BT=!!s.bt;RM=s.code;subRT();await refresh(true);if(!ROOM||(!MOD&&!P.find(p=>p.id===ME))){toast('Room sudah tidak ada');return leave(true)}ROOM.status==='waiting'?go('lobby'):ROOM.status==='playing'?(scr='lobby',MOD?go('mon'):startGame()):(scr='lobby',end())}
async function leave(sil){clearInterval(tm);if(G)G.run=false;if(sb&&ME&&!sil)try{await rpc('leave_room',{p_pid:ME})}catch(e){}unsub();localStorage.removeItem('fk_sess');RM=ROOM=ME=null;MOD=false;BT=false;P=[];G=null;go('home')}
function exitGame(){if(!confirm('Keluar dari pertandingan? Di mode online kamu bisa bergabung kembali dari menu utama.'))return;clearInterval(tm);if(G)G.run=false;unsub();G=null;go('home')}
async function setPause(on){try{await rpc('set_pause',{p_pid:ME,p_on:on});refresh()}catch(e){toast(e.message)}}
async function finishRoom(){if(!confirm('Selesaikan pertandingan sekarang? Klasemen akhir akan langsung tampil untuk semua pemain.'))return;try{await rpc('finish_room',{p_pid:ME});await refresh()}catch(e){toast('Gagal menyelesaikan game: '+(e.message||'fungsi finish_room belum ada di Supabase'))}}
async function startRoom(){try{await rpc('start_room',{p_pid:ME});refresh()}catch(e){toast(e.message)}}
function onUp(){if(!ROOM)return;if(ROOM.status==='cancelled'&&scr!=='home'){toast('Room dibatalkan oleh host');return leave(true)}
 if(scr==='lobby'){ROOM.status==='playing'?(MOD?go('mon'):startGame()):ROOM.status==='finished'?end():draw()}
 else if(scr==='mon'){ROOM.status==='finished'?end():draw()}
 else if(scr==='game'){ROOM.status==='finished'?end():upd()}}
async function send(i,v,n=0){try{const ok=await rpc('submit_answer',{p_pid:ME,p_q:i,p_v:v});if(ok===false){if(!ROOM||ROOM.status==='playing')setTimeout(()=>send(i,v,n),1500);return}refresh()}catch(e){if(n<3)setTimeout(()=>send(i,v,n+1),1500);else toast('Gagal mengirim jawaban')}}

function startSolo(){if(!cfg.name.trim())return toast('Isi nama dulu');G=initG(true,{grade:cfg.grade,subj:cfg.subj,secs:Math.max(5,cfg.secs||20),target:Math.max(10,cfg.target||100)},Math.floor(Math.random()*1e6));G.me.name=cfg.name.trim();go('game')}
function startGame(){if(G&&scr==='game')return;const me=P.find(p=>p.id===ME);G=initG(false,{grade:ROOM.grade,subj:ROOM.subject,secs:ROOM.secs,target:ROOM.target},ROOM.seed*31+parseInt(ME.slice(0,6),16)%1000000);G.i=me?me.answered:0;go('game')}
function showQ(){if(G.i>=100){$('#q').textContent='Kamu sudah menyelesaikan semua soal. Menunggu pemain lain…';$('#opts').innerHTML='';$('#tb').style.width='0';return upd()}
 const q=getQ(G.i);G.lock=false;G.t0=performance.now();if(G.pz)G.pz=G.t0;$('#qn').textContent=`Soal ${G.i+1}/100`;$('#q').textContent=q.q;
 $('#opts').innerHTML=q.opts.map((o,j)=>`<button class="opt" onclick="ans(${j})"><b>${'ABCD'[j]}.</b> ${esc(o)}</button>`).join('');$('#fb').innerHTML='';$('#prog').style.width=G.i+'%';
 clearInterval(tm);tm=setInterval(()=>{if(G.pz)return;const l=G.cfg.secs-(performance.now()-G.t0)/1000;$('#tb').style.width=Math.max(0,l/G.cfg.secs*100)+'%';$('#tt').textContent=Math.max(0,Math.ceil(l))+' dtk';if(l<=0)ans(-1)},100);upd()}
function flt(t,c){const d=document.createElement('div');d.className='fl';d.textContent=t;d.style.color=c;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function ans(c){if(!G||G.lock||G.i>=100||!G.run||G.pz)return;G.lock=true;clearInterval(tm);const q=getQ(G.i),v=c<0?0:c===q.ans?1:-1;
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;b.style.opacity=1;if(j===q.ans)b.classList.add('ok');else if(j===c)b.classList.add('no')});
 $('#fb').innerHTML=`<div class="card"><b>${v>0?'✅ Benar! +5':v<0?'❌ Salah −5':c==-1?'⏰ Waktu habis (0)':'⏭️ Dilewati (0)'}</b><br><small>${esc(q.e)}</small></div>`;
 if(v>0){sfx(660);setTimeout(()=>sfx(880),90)}else if(v<0)sfx(180,.3,'sawtooth');
 if(v)flt(v>0?'+5':'−5',v>0?'#3ddc84':'#ff5d73');if(v<0)G.miss[q.c]=(G.miss[q.c]||0)+1;
 if(G.solo){const m=G.me;m.score+=v*5;m.answered++;if(v>0)m.correct++;if(v<0)m.wrong++}else send(G.i,v);
 upd();setTimeout(()=>{if(!G||!G.run)return;G.i++;if(G.solo&&(G.me.score>=G.cfg.target||G.i>=100))return end();showQ()},v?1700:1300)}
function grp(){const L=G.solo?[G.me]:P,t=!G.solo&&ROOM&&ROOM.mode==='team',m={};
 L.forEach(p=>{const k=t?'t'+p.team:p.id,g=m[k]=m[k]||{name:t?'Tim '+(p.team+1):p.name,score:0,correct:0,wrong:0,answered:0,mem:[],mine:false};
 g.score+=p.score;g.correct+=p.correct;g.wrong+=p.wrong;g.answered=Math.max(g.answered,p.answered);g.mem.push(p);if(p.id===(G.solo?'me':ME))g.mine=true});
 const r=Object.values(m).sort((a,b)=>b.score-a.score||b.correct-a.correct);return r.length?r:[{name:'-',score:0,correct:0,wrong:0,answered:0,mem:[],mine:false}]}
function pz(){const p=!!(ROOM&&ROOM.paused&&ROOM.status==='playing'),o=$('#pz');if(p&&!G.pz)G.pz=performance.now();if(!p&&G.pz){G.t0+=performance.now()-G.pz;G.pz=0}if(o)o.style.display=p?'flex':'none'}
function upd(){if(!G||scr!=='game')return;pz();const a=grp(),me=G.solo?G.me:P.find(p=>p.id===ME)||G.me;$('#sc').textContent=me.score;
 $('#lb').innerHTML=a.map((g,k)=>`<div class="${g.mine?'me':''}"><span>${k+1}. ${esc(g.name)}${g.mem.length>1?`<br><small>${g.mem.map(p=>esc(p.name)+' '+p.score).join(' · ')}</small>`:''}</span><b>${g.score} <small>(${g.answered}/100)</small></b></div>`).join('');updConn()}
async function end(){clearInterval(tm);if(!G)G=initG(false,{grade:ROOM.grade,subj:ROOM.subject,secs:ROOM.secs,target:ROOM.target},0);G.run=false;if(!G.solo){await refresh(true);unsub();localStorage.removeItem('fk_sess')}
 else{const lb=JSON.parse(localStorage.getItem('fk_lb')||'[]');lb.push({n:G.me.name,s:G.me.score,g:G.cfg.grade,j:GL[G.cfg.subj]});lb.sort((a,b)=>b.s-a.s);localStorage.setItem('fk_lb',JSON.stringify(lb.slice(0,5)))}
 sfx(523,.2);setTimeout(()=>sfx(784,.3),200);go('res')}

home:()=>`<div class="wrap">${logo}<div class="sub">SD FASTABIQUL KHAIRAT</div><h1>Clash of Champions</h1><p class="c" style="opacity:.8">Kompetisi akademik kelas 4, 5 &amp; 6</p>
<div class="card"><button class="big go" onclick="go('mode')">▶ Mulai</button>${localStorage.getItem('fk_sess')?`<button class="big alt" onclick="resume()">↩ Lanjutkan room online</button>`:''}<button class="big" onclick="showSet()">⚙️ Pengaturan</button><button class="big" onclick="quit()">🚪 Keluar</button></div></div>`,
mode:()=>`<div class="wrap"><button class="back" onclick="go('home')">← Kembali</button><h1>Pilih Mode</h1><div class="grid">
<button class="mc" onclick="cfg.kind='solo';go('setup')"><b>🎯 Main Solo</b><small>Main sendiri, kejar skor tertinggi</small></button>
<button class="mc" onclick="cfg.kind='online';go('setup')"><b>🌐 Main Online</b><small>Room berkode, 2–4 pemain/tim</small></button>
<button class="mc" onclick="cfg.kind='battle';cfg.maxp=2;go('setup')"><b>⚔️ Battle 1 vs 1</b><small>Duel dua pemain atau dua tim</small></button></div></div>`,
setup:()=>{const on=cfg.kind!=='solo',J=on&&cfg.role==='join';return`<div class="wrap"><button class="back" onclick="go('mode')">← Kembali</button><h1>${{solo:'Main Solo',online:'Main Online',battle:'Battle 1 vs 1'}[cfg.kind]}</h1>
${on?TABS(J):''}${J?'':`<div class="card"><label>Nama pemain</label><input maxlength=16 value="${esc(cfg.name)}" oninput="I('name',this.value)" placeholder="Nama kamu">
<label>Kelas</label>${seg('grade',[[4,'Kelas 4'],[5,'Kelas 5'],[6,'Kelas 6']])}<label>Mata pelajaran</label>${seg('subj',[['umum','Umum'],['mat','Matematika'],['ipas','IPAS']])}
${on?`<label>Mode</label>${seg('mode',[['ind','Individu'],['team','Beregu']])}`:''}${on&&cfg.kind==='online'&&cfg.mode==='ind'?`<label>Jumlah pemain</label>${seg('maxp',[[2,'2'],[3,'3'],[4,'4']])}`:''}${on&&cfg.kind==='online'&&cfg.mode==='team'?'<p style="font-size:.85rem;opacity:.8">Beregu: Tim 1–4 bisa bergabung. Mulai jika minimal 2 tim sudah ada.</p>':''}
<div class="row"><div><label>Target poin</label><input type=number min=10 max=500 step=5 value=${cfg.target} oninput="I('target',+this.value)"></div><div><label>Detik / soal</label><input type=number min=5 max=120 value=${cfg.secs} oninput="I('secs',+this.value)"></div></div>
<p style="font-size:.8rem;opacity:.7">Aturan: benar +5, salah −5, lewat/waktu habis 0. Maks 100 soal per pemain, soal &amp; pilihan diacak.</p>
${on?'<p style="font-size:.85rem;color:#ffc83d">🛡️ Pembuat room menjadi moderator: memantau pertandingan, tidak ikut bermain.</p>':''}<button class="big go" onclick="${on?'mkRoom()':'startSolo()'}">${on?'Buat Room':'Mulai Main'}</button></div>`}
${J?JN():''}</div>`},
lobby:()=>{const r=ROOM||{},host=r.host===ME,t=r.mode==='team',ok=t?new Set(P.map(p=>p.team)).size>1:P.length>1;
 return`<div class="wrap"><div><span class="dot${conn?'':' off'}" id="cd"></span>${conn?'Terhubung':'Terputus – mencoba lagi…'}</div><div class="card"><div class="c">Kode room</div><div class="code">${esc(RM)}</div><p class="c">Kelas ${r.grade} · ${GL[r.subject]||''} · target ${r.target} poin · ${r.secs} dtk/soal · ${t?'Beregu ('+r.maxp+' tim)':'Individu (maks '+r.maxp+')'}</p></div>
${MOD?'<p class="c">🛡️ Kamu moderator room ini (tidak ikut bermain). Bagikan kode ke pemain.</p>':''}<div class="card"><h3>Pemain (${P.length})</h3><div class="lb">${P.map(p=>`<div class="${p.id===ME?'me':''}"><span>${p.id===r.host?'👑 ':''}${esc(p.name)}</span><span>${t?'Tim '+(p.team+1):'Siap'}</span></div>`).join('')}</div></div>
${host?`<button class="big go" ${ok?'':'disabled'} onclick="startRoom()">${ok?'▶ Mulai Pertandingan':'Menunggu minimal 2 '+(t?'tim':'pemain')+'…'}</button>`:`<p class="c">${ok?'✅ Syarat pemain/tim sudah terpenuhi. Menunggu moderator menekan Play…':'Menunggu pemain/tim lain bergabung…'}</p>`}
<button class="big" onclick="leave()">${host?'Batalkan room':'Keluar room'}</button></div>`},
mon:()=>{const r=ROOM||{},t=r.mode==='team',a=P.slice().sort((x,y)=>y.score-x.score||y.correct-x.correct),ts={};if(t)P.forEach(p=>ts[p.team]=(ts[p.team]||0)+p.score);
 return`<div class="wrap"><div><span class="dot${conn?'':' off'}" id="cd"></span>${conn?'Terhubung':'Terputus – mencoba lagi…'}</div><h1>🛡️ Panel Moderator</h1><p class="c">Room ${esc(RM)} · Kelas ${r.grade} · ${GL[r.subject]||''} · target ${r.target} poin</p>
<button class="big ${r.paused?'go':'alt'}" onclick="setPause(${!r.paused})">${r.paused?'▶️ Lanjutkan pertandingan':'⏸️ Jeda pertandingan'}</button>${r.paused?'<p class="c" style="color:#ffc83d"><b>PERTANDINGAN SEDANG DIJEDA</b></p>':''}<button class="big" style="background:#d63a55" onclick="finishRoom()">🏁 Selesaikan pertandingan</button>
${t?`<div class="card"><b>Skor tim:</b> ${Object.entries(ts).map(([k,v])=>`Tim ${+k+1}: ${v}`).join(' · ')}</div>`:''}
<div class="card"><b>Progres pemain</b>${a.map((p,k)=>`<div style="margin:12px 0"><div class="hud"><span>${k+1}. ${esc(p.name)}${t?' (Tim '+(p.team+1)+')':''}</span><span>${p.score} poin</span></div><div class="bar"><i style="width:${p.answered}%"></i></div><small>Soal ${p.answered}/100 · ✔ ${p.correct} · ✘ ${p.wrong}</small></div>`).join('')||'<p>Belum ada pemain.</p>'}</div>
<button class="big" onclick="exitGame()">Keluar dari panel</button></div>`},
game:()=>`<div class="wrap"><div id="pz" class="modal" style="display:none"><div class="card c"><h2>⏸️ Dijeda moderator</h2><p>Tunggu moderator melanjutkan pertandingan.</p></div></div><div class="hud"><span id="qn"></span><span>Skor: <span id="sc">0</span></span><span id="tt"></span></div><div class="bar"><i id="tb"></i></div><div class="bar" style="height:5px"><i id="prog" style="width:0;background:#ffc83d"></i></div>
<div class="card"><div class="q" id="q"></div><div id="opts"></div><button onclick="ans(-2)" style="margin-top:6px">⏭️ Lewati (0)</button></div><div id="fb"></div>
<div class="card"><b>🏆 Leaderboard</b> <small style="opacity:.7">· target ${G.cfg.target}</small>${G.solo?'':'<span style="float:right"><span class="dot" id="cd"></span><span></span></span>'}<div class="lb" id="lb"></div></div><button class="back" onclick="exitGame()">Keluar</button></div>`,
res:()=>{const a=grp(),pp=[a[1],a[0],a[2]].map((g,i)=>g&&{g,r:[1,0,2][i]}).filter(Boolean),h=[100,75,55],me=a.find(g=>g.mine)||a[0],tie=a[1]&&a[0].score===a[1].score&&a[0].correct===a[1].correct,ms=Object.entries(G.miss).sort((x,y)=>y[1]-x[1]);
 return`<div class="wrap"><h1>🏆 ${G.solo?'Hasil Akhir':esc(a[0].name)+' Menang!'}</h1>${tie?'<p class="c">Skor dan jawaban benar seri (babak tie-breaker belum tersedia).</p>':''}
<div class="card"><div class="pod">${pp.map(({g,r})=>`<div class="${r==0?'p1':''}" style="height:${h[r]}%"><div style="font-size:1.6rem">${['🥇','🥈','🥉'][r]}</div><b>${esc(g.name)}</b><br>${g.score}</div>`).join('')}</div></div>
<div class="card"><h3 class="c">📊 Klasemen Akhir</h3><table><tr><th>#</th><th>Nama</th><th>Nilai</th><th>Benar</th><th>Salah</th><th>Akurasi</th></tr>${a.map((g,k)=>`<tr><td>${k+1}</td><td>${esc(g.name)}</td><td>${g.score}</td><td>${g.correct}</td><td>${g.wrong}</td><td>${g.correct+g.wrong?Math.round(g.correct/(g.correct+g.wrong)*100):0}%</td></tr>`).join('')}</table></div>
<div class="card"><b>📚 Ringkasan belajar</b><p>${ms.length?'Topik yang perlu diulang: '+ms.map(([k,n])=>`${esc(k)} (${n}×salah)`).join(', ')+'.':'Tidak ada jawaban salah di perangkat ini. Hebat!'}</p></div>
${G.solo?`<div class="card"><b>Skor tertinggi (di perangkat ini)</b><div class="lb">${JSON.parse(localStorage.getItem('fk_lb')||'[]').map((x,k)=>`<div><span>${k+1}. ${esc(x.n)} <small>(Kls ${x.g} ${x.j})</small></span><b>${x.s}</b></div>`).join('')}</div></div>`:''}
${MOD&&BT?`<div class="card"><b>⬇️ Unduh klasemen (moderator)</b><div class="row"><button class="big alt" onclick="dl('pdf')">📄 PDF</button><button class="big alt" onclick="dl('doc')">📝 Word</button></div></div>`:''}<button class="big go" onclick="${G.solo?'startSolo()':"leave(true)"}">Main Lagi</button><button class="big" onclick="${G.solo?"go('home');G=null":'leave(true)'}">Menu Utama</button></div>`}};
const acc=g=>g.correct+g.wrong?Math.round(g.correct/(g.correct+g.wrong)*100)+'%':'0%';
function rep(){const a=grp(),t=!G.solo&&ROOM&&ROOM.mode==='team',c=G.solo?G.cfg:{grade:ROOM.grade,subj:ROOM.subject,target:ROOM.target},ms=Object.entries(G.miss).sort((x,y)=>y[1]-x[1]);
 return`<h1>SD Fastabiqul Khairat - Clash of Champions</h1><h2>Laporan Hasil Pertandingan</h2><p>Tanggal: ${new Date().toLocaleString('id-ID')}<br>Mode: ${G.solo?'Main Solo':(BT?'Battle 1 vs 1':'Online')+' ('+(t?'Beregu':'Individu')+')'}${G.solo?'':'<br>Kode room: '+esc(RM)}<br>Kelas ${c.grade} | ${GL[c.subj]} | Target ${c.target} poin | Benar +5, salah -5, lewat 0</p><p><b>Pemenang: ${esc(a[0].name)} (${a[0].score} poin)</b></p><table border="1" cellspacing="0" cellpadding="6"><tr><th>No</th><th>Nama</th><th>Nilai</th><th>Benar</th><th>Salah</th><th>Akurasi</th><th>Soal dijawab</th></tr>${a.map((g,k)=>`<tr><td>${k+1}</td><td>${esc(g.name)}</td><td>${g.score}</td><td>${g.correct}</td><td>${g.wrong}</td><td>${acc(g)}</td><td>${g.answered}/100</td></tr>`).join('')}</table>${t?'<h3>Kontribusi anggota</h3>'+a.map(g=>`<p><b>${esc(g.name)}</b>: ${g.mem.map(p=>esc(p.name)+' ('+p.score+' poin)').join(', ')}</p>`).join(''):''}<h3>Ringkasan belajar</h3><p>${ms.length?'Topik yang perlu diulang: '+ms.map(([k,n])=>esc(k)+' ('+n+'x salah)').join(', ')+'.':'Tidak ada jawaban salah yang tercatat di perangkat ini.'}</p>`}
function dl(k){const h=rep(),n='hasil-clash-of-champions';
 if(k==='doc'){const b=new Blob(['\ufeff<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Hasil</title></head><body style="font-family:Arial">'+h+'</body></html>'],{type:'application/msword'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n+'.doc';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('File Word diunduh')}
 else{const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.appendChild(f);const d=f.contentDocument;d.open();d.write('<html><head><meta charset="utf-8"><title>'+n+'</title><style>body{font-family:Arial,sans-serif;padding:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #444;padding:6px;text-align:center}</style></head><body>'+h+'</body></html>');d.close();toast("Di dialog cetak, pilih 'Simpan sebagai PDF'");setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print()},400);setTimeout(()=>f.remove(),60000)}}
function draw(){$('#app').innerHTML=SC[scr]();if(scr==='game')showQ();updConn();music();rlSync()}
function quit(){if(confirm('Keluar dari permainan?')){window.close();toast('Sampai jumpa, juara! Kamu bisa menutup tab ini.')}}
addEventListener('keydown',e=>{if(scr!=='game'||!G||!G.run||e.target.tagName==='INPUT')return;const k='1234'.indexOf(e.key),l='abcd'.indexOf(e.key.toLowerCase());if(e.key.length==1){if(k>=0)ans(k);else if(l>=0)ans(l);else if(e.key.toLowerCase()==='s')ans(-2)}});
draw();
</script></body></html>
